name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например 0.1.0"
        required: true
        default: "0.1.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        env:
          RAW: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          version="${RAW#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Версия должна быть вида 1.2.3, получено: $RAW" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$version"
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >>"$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GYRO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/gyro.jks"
            echo "GYRO_KEYSTORE_FILE=$RUNNER_TEMP/gyro.jks" >>"$GITHUB_ENV"
            echo "SIGNED_WITH=release" >>"$GITHUB_ENV"
          else
            echo "SIGNED_WITH=debug" >>"$GITHUB_ENV"
          fi

      - name: Tests and release APK
        env:
          GYRO_KEYSTORE_PASSWORD: ${{ secrets.GYRO_KEYSTORE_PASSWORD }}
          GYRO_KEY_ALIAS: ${{ secrets.GYRO_KEY_ALIAS }}
          GYRO_KEY_PASSWORD: ${{ secrets.GYRO_KEY_PASSWORD }}
        run: >
          ./gradlew --stacktrace :protocol:test :app:assembleRelease
          -PgyroVersionName="$VERSION" -PgyroVersionCode="$VERSION_CODE"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Gyro-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp .github/release-notes.md notes.md
          if [ "$SIGNED_WITH" = debug ]; then
            printf '\n**Подпись:** сборка подписана отладочным ключом. Следующую версию, возможно, придётся ставить после удаления этой.\n' >>notes.md
          fi
          gh release create "v$VERSION" "$apk" --title "Gyro $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
